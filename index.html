<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Kosmic — тренировки, еда, цели и привычки</title>
  <meta name="description" content="Личный трекер: тренировки, питание, цели и привычки. Данные хранятся на устройстве." />
  <meta name="theme-color" content="#0b0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kosmic" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-32.png" type="image/png" />
  <link rel="apple-touch-icon" href="icons/icon-180.png?v=2" />
  <link rel="stylesheet" href="css/styles.css?v=22" />
</head>
<body>
  <div class="bg-orbs" aria-hidden="true">
    <span class="orb orb-1"></span><span class="orb orb-2"></span><span class="orb orb-3"></span>
  </div>

  <div class="app">
    <nav class="nav" id="nav" aria-label="Разделы"></nav>
    <main class="main" id="main"></main>
  </div>

  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas class="confetti" id="confetti" aria-hidden="true"></canvas>

  <noscript>Для работы приложения включите JavaScript.</noscript>
  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    } }
  </script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
